version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: cat_feeder_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: catfeeder
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: